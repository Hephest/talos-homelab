# Headless service required by the StatefulSet for pod DNS (home-assistant-0.home-assistant.home-assistant.svc.cluster.local)
apiVersion: v1
kind: Service
metadata:
  name: home-assistant
  namespace: home-assistant
spec:
  clusterIP: None
  selector:
    app: home-assistant
  ports:
    - name: http
      port: 8123
      targetPort: 8123
---
# LoadBalancer service for external access via MetalLB VIP 192.168.31.51
apiVersion: v1
kind: Service
metadata:
  name: home-assistant-lb
  namespace: home-assistant
spec:
  type: LoadBalancer
  loadBalancerIP: 192.168.31.51
  selector:
    app: home-assistant
  ports:
    - name: http
      port: 8123
      targetPort: 8123
      protocol: TCP
