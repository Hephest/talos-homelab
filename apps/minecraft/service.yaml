# Headless service required by the StatefulSet for pod DNS
# (minecraft-bedrock-0.minecraft-bedrock.minecraft.svc.cluster.local)
apiVersion: v1
kind: Service
metadata:
  name: minecraft-bedrock
  namespace: minecraft
spec:
  clusterIP: None
  selector:
    app: minecraft-bedrock
  ports:
    - name: bedrock
      port: 19132
      targetPort: 19132
      protocol: UDP
---
# LoadBalancer service for external LAN access via MetalLB VIP 192.168.31.50
apiVersion: v1
kind: Service
metadata:
  name: minecraft-bedrock-lb
  namespace: minecraft
spec:
  type: LoadBalancer
  loadBalancerIP: 192.168.31.50
  selector:
    app: minecraft-bedrock
  ports:
    - name: bedrock
      port: 19132
      targetPort: 19132
      protocol: UDP
