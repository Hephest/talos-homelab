apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: minecraft-bedrock
  namespace: minecraft
spec:
  serviceName: minecraft-bedrock
  replicas: 1
  selector:
    matchLabels:
      app: minecraft-bedrock
  template:
    metadata:
      labels:
        app: minecraft-bedrock
    spec:
      nodeSelector:
        kubernetes.io/hostname: talos-w1
      containers:
        - name: minecraft-bedrock
          image: itzg/minecraft-bedrock-server:latest
          ports:
            - name: bedrock
              containerPort: 19132
              protocol: UDP
          env:
            - name: EULA
              value: "TRUE"
            - name: TZ
              value: Europe/Kyiv
            - name: SERVER_NAME
              value: "<<< TALOS >>>"
            - name: GAMEMODE
              value: survival
            - name: ALLOW_LIST
              value: "true"
          volumeMounts:
            - name: data
              mountPath: /data
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          readinessProbe:
            exec:
              command:
                - mc-monitor
                - status
                - --bedrock
                - --host
                - 127.0.0.1
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 6
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: local-path
        resources:
          requests:
            storage: 5Gi
